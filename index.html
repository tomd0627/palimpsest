<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palimpsest</title>
    <meta
      name="description"
      content="A generative visual piece — layers of text and form accumulate, fade, and overwrite each other in real time."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas
      id="canvas"
      role="img"
      aria-label="Decorative generative art. Layers of text and abstract marks accumulate on a parchment ground, each periodic wash ghosting what came before."
    ></canvas>
    <nav class="controls" aria-label="Animation controls">
      <button class="btn" id="btn-pause" aria-pressed="false" title="Pause (Space)">
        <span class="btn-icon" aria-hidden="true">‖</span>
        <span class="btn-label">Pause</span>
      </button>
      <button class="btn" id="btn-reset" title="Reset (R)">
        <span class="btn-icon" aria-hidden="true">↺</span>
        <span class="btn-label">Reset</span>
      </button>
    </nav>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
